[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iitp-blockchain-assignments"
version = "1.0.0"
description = "Seven reproducible educational blockchain assignments"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
p2p = ["websockets>=12.0"]

[project.scripts]
hashlab = "blockchain_lab.a1:main"
merklelab = "blockchain_lab.a2:main"
walletlab = "blockchain_lab.a3:main"
ledgerlab = "blockchain_lab.a4:main"
chainlab = "blockchain_lab.a5:main"
p2plab = "blockchain_lab.a6:main"

[tool.setuptools.packages.find]
include = ["blockchain_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
